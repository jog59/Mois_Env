<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Mois de l'environnement 2026</title>

  <script src="./js/three.min.js"></script>
  <script src="./js/panolens.min.js"></script>

  <style>
    body {
      margin: 0;
    }

    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ===== PANEL ===== */
    #infoPanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      max-width: 95vw;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.35);
      display: none;
      z-index: 99999;
    }

    .panel-content {
      display: flex;
      gap: 20px;
    }

    .panel-left {
      flex: 0.4;
      position: relative;
    }

    .panel-image {
      width: 100%;
      border-radius: 10px;
    }

    #infoImage {
      display: block;
      position: relative;
      z-index: 1;
    }

    #infoVideo {
      display: none;
      position: relative;
      z-index: 3;
    }

    #videoOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none; /* ✅ très important */
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 2;
    }

    .panel-right {
      flex: 0.6;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .panel-text {
      flex: 1;
      white-space: pre-line;
    }

    .panel-logos {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .panel-logo {
      width: 80px;
    }

    #closePanelBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 18px;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* ===== UI ===== */
    #counter {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div id="viewer">

    <!-- PANEL -->
    <div id="infoPanel">

      <button id="closePanelBtn">✖</button>

      <div class="panel-content">

        <!-- LEFT -->
        <div class="panel-left">

          <img id="infoImage" class="panel-image">

          <div id="videoOverlay">
            ▶️
          </div>

          <video id="infoVideo" class="panel-image" controls></video>

        </div>

        <!-- RIGHT -->
        <div class="panel-right">
          <h2 id="infoTitle"></h2>
          <p id="infoText"></p>
          <div class="panel-logos"></div>
        </div>

      </div>
    </div>

    <!-- COMPTEUR -->
    <div id="counter">Zones trouvées : 0</div>

  </div>

  <script>

    /* ===== SHOW PANEL ===== */
    window.showInfoPanel = function (title, text, imageUrl, logos = [], videoUrl = null) {

      const image = document.getElementById("infoImage");
      const video = document.getElementById("infoVideo");
      const overlay = document.getElementById("videoOverlay");

      document.getElementById("infoTitle").innerText = title;
      document.getElementById("infoText").innerText = text;

      /* LOGOS */
      const logosContainer = document.querySelector(".panel-logos");
      logosContainer.innerHTML = "";

      logos.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.className = "panel-logo";
        logosContainer.appendChild(img);
      });

      /* RESET VIDEO */
      video.pause();
      video.currentTime = 0;

      /* IMAGE + VIDEO */
      if (videoUrl) {

        image.src = imageUrl;
        image.style.display = "block";

        overlay.style.display = "flex";

        video.style.display = "none";

        overlay.onclick = () => {
          overlay.style.display = "none";
          image.style.display = "none";

          video.src = videoUrl;
          video.style.display = "block";
          video.play();
        };

      } else {

        image.src = imageUrl;
        image.style.display = "block";

        overlay.style.display = "none";
        video.style.display = "none";
      }

      document.getElementById("infoPanel").style.display = "block";
    };

    /* CLOSE PANEL */
    document.getElementById("closePanelBtn").addEventListener("pointerdown", () => {

      const video = document.getElementById("infoVideo");
      video.pause();
      video.currentTime = 0;

      document.getElementById("infoPanel").style.display = "none";
    });

  </script>

  <script src="./js/panels.js"></script>
  <script src="./js/detection.js"></script>

</body>
</html>
