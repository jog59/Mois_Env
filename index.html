<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <title>Mois de l'environnement 2026</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/EcoBaboy.png">
    <script src="./js/three.min.js"></script>
    <script src="./js/panolens.min.js"></script>

    <style>
        body {
            margin: 0;
        }

        #viewer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        /* Bouton Play/Pause flottant */
        #toggleRotate {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 18px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 999999;
            pointer-events: auto;
        }

        #switchImagePrev {
            position: absolute;
            bottom: 20px;
            left: 160px; /* même place que le bouton suivant par défaut */
            padding: 12px 18px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 999999;
            pointer-events: auto;
            /*display: none;*/ /* caché par défaut */
        }


        /* Bouton changement image */
        #switchImage {
            position: absolute;
            bottom: 20px;
            left: 370px;
            padding: 12px 18px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 999999;
            pointer-events: auto;
        }



        /* PANEL MEDIA CAROUSEL */
        #infoPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96vw;
            height: 92vh;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 60px rgba(0,0,0,0.7);
            display: none;
            z-index: 99999;
            font-family: Arial, sans-serif;
            pointer-events: auto;
        }

        /* Zone média principale */
        #panelMediaWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .panel-media-item {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .panel-media-item.active {
            opacity: 1;
            pointer-events: auto;
        }

        .panel-media-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .panel-media-item video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Bouton fermer */
        #closePanelBtn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(0,0,0,0.55);
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #fff;
            z-index: 10;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        #closePanelBtn:hover { background: rgba(255,255,255,0.2); }

        /* Flèches navigation */
        .panel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 28px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .panel-nav:hover { background: rgba(255,255,255,0.25); }
        .panel-nav:disabled { opacity: 0.2; cursor: default; }
        #panelPrev { left: 10px; }
        #panelNext { right: 10px; }

        /* Indicateurs (dots) */
        #panelDots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            z-index: 10;
        }

        .panel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .panel-dot.active {
            background: #fff;
            transform: scale(1.3);
        }

        /* COMPTEUR */
        #counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 18px;
            z-index: 999999;
            pointer-events: none;
        }


        #pad {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 999999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

#pad button {
  width: 60px;
  height: 60px;
  font-size: 20px;
  border-radius: 10px;
  border: none;
  background: rgba(0,0,0,0.6);
  color: white;
  cursor: pointer;
}
    </style>
</head>

<body>

    <div id="viewer">
        <!-- PAD DIRECTIONNEL -->
        <div id="pad">
          <button id="up">⬆️</button>
            <div>
            <button id="left">⬅️</button>
            <button id="right">➡️</button>
          </div>
          <button id="down">⬇️</button>
    </div>
        
        <!-- PANEL D'INFO MEDIA -->
        <div id="infoPanel">

            <div id="panelMediaWrapper">
                <!-- Les items média sont injectés dynamiquement -->
                <button id="closePanelBtn" title="Fermer">✕</button>
                <button class="panel-nav" id="panelPrev">&#8249;</button>
                <button class="panel-nav" id="panelNext">&#8250;</button>
                <div id="panelDots"></div>
            </div>

        </div>

        <!-- BOUTONS -->



        <button id="toggleRotate">▶️ Rotation</button>
        <button id="switchImage">Image suivante ➡️</button>
        <button id="switchImagePrev">⬅️ Image précédente</button>

        <button id="debugBtn" style="
    position: absolute;
    top: 80px;
    right: 25px;
    z-index: 999999;
">
            DEBUG
        </button>

        <!-- COMPTEUR -->
        <div id="counter">
            Zones trouvées : 0
        </div>
        
    </div>

    <script>
        /* --- PANORAMAS --- */
        const pano1 = new PANOLENS.ImagePanorama('assets/image1.jpg');
        const pano2 = new PANOLENS.ImagePanorama('assets/image2.jpg');
        const pano3 = new PANOLENS.ImagePanorama('assets/plastic.jpg');
        const pano4 = new PANOLENS.ImagePanorama('assets/image3.jpg');



        /* --- VIEWER --- */
        const viewer = new PANOLENS.Viewer({
            container: document.querySelector('#viewer'),
            autoRotate: false,
            autoRotateSpeed: 0.3,
            controlBar: true,
            output: 'console',
            renderer: new THREE.WebGLRenderer({ antialias: true })
        });

        
// ✅ CONFIG SENSIBILITÉ

/*
if ('ontouchstart' in window) {

  viewer.OrbitControls.rotateSpeed = 1.2;

  viewer.OrbitControls.enableDamping = true;
  viewer.OrbitControls.dampingFactor = 0.05;

  viewer.OrbitControls.enablePan = false;
  viewer.OrbitControls.enableZoom = false;

} else {

  viewer.OrbitControls.rotateSpeed = 1.0;

  viewer.OrbitControls.enableDamping = true;
  viewer.OrbitControls.dampingFactor = 0.05;
}
*/



        viewer.renderer.setPixelRatio(window.devicePixelRatio);
        viewer.renderer.setSize(window.innerWidth, window.innerHeight);

        viewer.add(pano1);
        viewer.add(pano2);
        viewer.add(pano3);
        viewer.add(pano4);

//------------------------------
//--MOUVEMENT PAD DIRECTIONNEL--
//------------------------------        

let moveLeft = false;
let moveRight = false;
let moveUp = false;
let moveDown = false;

// gestion appui continu
function bindButton(id, direction) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", () => {
    direction.value = true;
  });

  btn.addEventListener("pointerup", () => {
    direction.value = false;
  });

  btn.addEventListener("pointerleave", () => {
    direction.value = false;
  });
}

// variables objets pour passer par référence
const left = { value: false };
const right = { value: false };
const up = { value: false };
const down = { value: false };

// bind boutons
bindButton("left", left);
bindButton("right", right);
bindButton("up", up);
bindButton("down", down);


        
function animatePad() {
  requestAnimationFrame(animatePad);

  const speed = 0.02;

  if (left.value) {
    viewer.OrbitControls.rotateLeft(-speed);
  }

  if (right.value) {
    viewer.OrbitControls.rotateLeft(speed);
  }

  if (up.value) {
    viewer.OrbitControls.rotateUp(-speed);
  }

  if (down.value) {
    viewer.OrbitControls.rotateUp(speed);
  }
}

animatePad();

        
document.getElementById("pad").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
});

        
//-------------------------------------
        let currentPano = pano1;
        let panelJustClosed = false;

        // État initial : image 1
        switchImagePrev.disabled = true;   // pas de précédent
        switchImage.disabled = false;      // suivant actif

        /* --- SWITCH IMAGE --- */
        switchImage.addEventListener("pointerdown", (event) => {
            if (switchImage.disabled) return; // inactif = ne fait rien
            event.preventDefault();
            event.stopImmediatePropagation();

            // IMAGE 1 → 2
            if (currentPano === pano1) {
                currentPano = pano2;
                viewer.setPanorama(pano2);

                deactivateHotspots(hotspotsPano1);
                activateHotspots(hotspotsPano2);
                hideCheckmarks(checkmarksPano1);
                showCheckmarks(checkmarksPano2);

                updateDebugVisibility();

                switchImagePrev.disabled = false;  // actif
                switchImage.disabled = false;      // actif.

                updateCounter();
                return;
            }

            // IMAGE 2 → 3
            if (currentPano === pano2) {
                currentPano = pano3;
                viewer.setPanorama(pano3);

                deactivateHotspots(hotspotsPano2);
                activateHotspots(hotspotsPano3);
                hideCheckmarks(checkmarksPano2);
                showCheckmarks(checkmarksPano3);

                updateDebugVisibility();

                switchImage.disabled = false;       // ➡️ actif
                switchImagePrev.disabled = false;  // ⬅️ actif

                updateCounter();
                return;
            }

            // IMAGE 3 → 4
            if (currentPano === pano3) {
                currentPano = pano4;
                viewer.setPanorama(pano4);

                deactivateHotspots(hotspotsPano3);
                activateHotspots(hotspotsPano4);
                hideCheckmarks(checkmarksPano3);
                showCheckmarks(checkmarksPano4);

                updateDebugVisibility();

                switchImage.disabled = true;       // ➡️ désactivé
                switchImagePrev.disabled = false;  // ⬅️ actif

                updateCounter();
                return;
            }


        });

        switchImagePrev.addEventListener("pointerdown", (event) => {
            if (switchImagePrev.disabled) return;
            event.preventDefault();
            event.stopImmediatePropagation();

            // IMAGE 4 → 3
            if (currentPano === pano4) {
                currentPano = pano3;
                viewer.setPanorama(pano3);

                deactivateHotspots(hotspotsPano4);
                activateHotspots(hotspotsPano3);
                hideCheckmarks(checkmarksPano4);
                showCheckmarks(checkmarksPano3);

                switchImagePrev.disabled = false;
                switchImage.disabled = false;
                updateCounter();
                return;
            }


            // IMAGE 3 → 2
            if (currentPano === pano3) {
                currentPano = pano2;
                viewer.setPanorama(pano2);

                deactivateHotspots(hotspotsPano3);
                activateHotspots(hotspotsPano2);
                hideCheckmarks(checkmarksPano3);
                showCheckmarks(checkmarksPano2);

                switchImagePrev.disabled = false;
                switchImage.disabled = false;
                updateCounter();
                return;
            }

            // IMAGE 2 → 1
            if (currentPano === pano2) {
                currentPano = pano1;
                viewer.setPanorama(pano1);

                deactivateHotspots(hotspotsPano2);
                activateHotspots(hotspotsPano1);
                hideCheckmarks(checkmarksPano2);
                showCheckmarks(checkmarksPano1);

                switchImagePrev.disabled = true;  // ⬅️ désactivé
                switchImage.disabled = false;     // ➡️ actif
                updateCounter();
                return;
            }
        });



        /* --- ROTATION AUTO --- */
        let isAutoRotateOn = false;
        let savedRotationState = false;

        function setAutoRotate(state) {
            isAutoRotateOn = state;
            if (viewer.OrbitControls) viewer.OrbitControls.autoRotate = state;
            document.getElementById("toggleRotate").innerText =
                state ? "⏸️ Pause" : "▶️ Rotation";
        }

        document.getElementById("toggleRotate").addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            setAutoRotate(!isAutoRotateOn);
        });

        /* --- PANEL MEDIA CAROUSEL --- */
        let panelMediaIndex = 0;
        let panelMediaList = [];
        let panelCurrentVideo = null;

        function renderPanelMedia(media) {
            const wrapper = document.getElementById("panelMediaWrapper");

            // Supprimer anciens items (sauf boutons fixes)
            wrapper.querySelectorAll(".panel-media-item").forEach(el => el.remove());

            // Vider dots
            const dotsEl = document.getElementById("panelDots");
            dotsEl.innerHTML = "";

            panelMediaList = media;
            panelMediaIndex = 0;
            panelCurrentVideo = null;

            // Créer les items
            media.forEach((item, i) => {
                const div = document.createElement("div");
                div.className = "panel-media-item" + (i === 0 ? " active" : "");

                if (item.type === "video") {
                    const vid = document.createElement("video");
                    vid.src = item.src;
                    vid.controls = true;
                    vid.preload = "metadata";
                    if (item.autoplay && i === 0) { vid.autoplay = true; vid.muted = !!item.muted; }
                    div.appendChild(vid);
                    if (i === 0) panelCurrentVideo = vid;
                } else {
                    const img = document.createElement("img");
                    img.src = item.src;
                    img.alt = item.alt || "";
                    div.appendChild(img);
                }

                // Insérer avant les boutons (avant closePanelBtn)
                wrapper.insertBefore(div, wrapper.querySelector("#closePanelBtn"));

                // Dot
                if (media.length > 1) {
                    const dot = document.createElement("div");
                    dot.className = "panel-dot" + (i === 0 ? " active" : "");
                    dot.addEventListener("pointerdown", (e) => { e.stopPropagation(); goToMedia(i); });
                    dotsEl.appendChild(dot);
                }
            });

            updatePanelNav();
        }

        function goToMedia(index) {
            const items = document.querySelectorAll(".panel-media-item");
            const dots  = document.querySelectorAll(".panel-dot");

            // Pauser vidéo courante
            if (panelCurrentVideo) { panelCurrentVideo.pause(); panelCurrentVideo = null; }

            items[panelMediaIndex]?.classList.remove("active");
            dots[panelMediaIndex]?.classList.remove("active");

            panelMediaIndex = index;

            items[panelMediaIndex]?.classList.add("active");
            dots[panelMediaIndex]?.classList.add("active");

            // Gérer vidéo entrante
            const activeVid = items[panelMediaIndex]?.querySelector("video");
            if (activeVid) { panelCurrentVideo = activeVid; }

            updatePanelNav();
        }

        function updatePanelNav() {
            document.getElementById("panelPrev").disabled = (panelMediaIndex === 0);
            document.getElementById("panelNext").disabled = (panelMediaIndex === panelMediaList.length - 1);
            // Cacher nav si un seul média
            const show = panelMediaList.length > 1;
            document.getElementById("panelPrev").style.display = show ? "" : "none";
            document.getElementById("panelNext").style.display = show ? "" : "none";
        }

        document.getElementById("panelPrev").addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            if (panelMediaIndex > 0) goToMedia(panelMediaIndex - 1);
        });

        document.getElementById("panelNext").addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            if (panelMediaIndex < panelMediaList.length - 1) goToMedia(panelMediaIndex + 1);
        });

        window.showInfoPanel = function (title, text, imageUrl, logos = [], media = null) {

            // Construire la liste média : priorité au tableau `media`, sinon fallback image simple
            const mediaList = media && media.length > 0
                ? media
                : [{ type: "image", src: imageUrl }];

            renderPanelMedia(mediaList);

            document.getElementById("infoPanel").style.display = "block";


            savedRotationState = isAutoRotateOn;
            setAutoRotate(false);
            disableViewerControls();
        };

        window.disableViewerControls = function () {
            if (viewer.OrbitControls) viewer.OrbitControls.enabled = false;
        };

        window.enableViewerControls = function () {
            if (viewer.OrbitControls) viewer.OrbitControls.enabled = true;
        };

        document.getElementById("closePanelBtn").addEventListener("pointerdown", () => {
            if (panelCurrentVideo) { panelCurrentVideo.pause(); panelCurrentVideo = null; }
            document.getElementById("infoPanel").style.display = "none";
            setAutoRotate(savedRotationState);
            enableViewerControls();

            // Bloquer les clics sur la scène pendant 300ms après fermeture
            panelJustClosed = true;
            setTimeout(() => { panelJustClosed = false; }, 300);
        });

        document.getElementById("infoPanel").addEventListener("pointerdown", (event) => {
            event.stopPropagation();
        });

        document.getElementById("debugBtn").addEventListener("pointerdown", () => {
            debugMode = !debugMode;
            updateDebugVisibility();
        });

    </script>

    <script src="./js/panels.js"></script>
    <script src="./js/detection.js"></script>
    <script src="./js/animation.js"></script>

</body>
</html>
